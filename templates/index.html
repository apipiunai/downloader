<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Downloader</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background: #f5f5f5;
        }
        .box {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 48%;
            padding: 12px;
            font-size: 16px;
            margin: 4px 1%;
            cursor: pointer;
        }
        #status {
            margin-top: 16px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>Media Downloader</h2>
        
        <input type="url" id="url" placeholder="Pega el link aquí...">
        
        <div style="display: flex; justify-content: space-between;">
            <button onclick="download('audio')">Audio</button>
            <button onclick="download('video')">Video</button>
        </div>
        
        <div id="status"></div>
    </div>

    <script>
        async function download(type) {
            const url = document.getElementById('url').value.trim();
            const status = document.getElementById('status');
            const buttons = document.querySelectorAll('button');

            if (!url) {
                status.textContent = 'Ingresa una URL';
                return;
            }

            status.textContent = 'Descargando...';
            buttons.forEach(b => b.disabled = true);

            try {
                const response = await fetch(`/download/${type}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ url: url })
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error || 'Error al descargar');
                }

                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = type === 'audio' ? 'audio.mp3' : 'video.mp4';
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(downloadUrl);

                status.textContent = '¡Listo!';
            } catch (err) {
                status.textContent = err.message;
            } finally {
                buttons.forEach(b => b.disabled = false);
            }
        }
    </script>
</body>
</html>
